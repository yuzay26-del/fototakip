* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

.brand { display: grid; min-width: 0; }

.brand small { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.search { margin-left: auto; position: relative; width: min(300px, 100%); }
.search input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; }
.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); overflow: hidden; z-index: 20; }

.results button:hover, .results button.on { background: var(--accent-soft); }
.results .lay { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.body { position: relative; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
.stage { position: relative; min-width: 0; min-height: 0; background: var(--stage); overflow: hidden; touch-action: none; }
#gl { position: absolute; inset: 0; }
#gl canvas { display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lbl { font: 500 11px var(--f-body); color: var(--ink); background: var(--label-bg); padding: 1px 6px; border-radius: 5px; white-space: nowrap; pointer-events: auto; cursor: pointer; transform: translateY(-18px); transition: opacity .2s; border: 1px solid transparent; }

.lbl.dim { opacity: .12 !important; }
.lbl.hot { border-color: var(--accent); font-weight: 600; opacity: 1 !important; z-index: 2; }
.lbl.step { background: var(--accent); color: var(--panel); opacity: 1 !important; }
.lay-lbl { font: 700 13px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; pointer-events: none; }
.toolbar { position: absolute; z-index: 4; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); right: 12px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.toolbar > * { pointer-events: auto; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; color: var(--muted); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); background: var(--accent-soft); }
.chip .sw { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.ctrls { position: absolute; z-index: 4; right: 12px; bottom: 12px; display: flex; gap: 8px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.icon-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

.list button:hover { background: var(--accent-soft); }

.steps li.done::before { border-color: var(--accent); color: var(--accent); }
.steps b { font-weight: 600; display: block; font-size: 13px; }
.steps span { font-size: 12.5px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 12px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.legend { display: grid; gap: 5px; font-size: 12.5px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.note { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--accent); padding: 6px 10px; background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
.sheet-handle { display: none; }

<script>
(() => {
'use strict';
const G = JSON.parse(document.getElementById('graph').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const LAYERS = [
  { name: 'Cihaz ve dış servisler', short: 'Dış' },
  { name: 'Arayüz', short: 'Arayüz' },
  { name: 'API uç noktaları', short: 'API' },
  { name: 'Sunucu modülleri', short: 'Sunucu' },
  { name: 'Veri', short: 'Veri' },
  { name: 'Kurulum ve işletim', short: 'İşletim' }
];
const KIND = {
  ui: { name: 'Ekran', c: '--k-ui' }, api: { name: 'Uç nokta', c: '--m-get' }, module: { name: 'Python modülü', c: '--k-module' },
  table: { name: 'Tablo', c: '--k-table' }, store: { name: 'Dosya / veritabanı', c: '--k-store' }, external: { name: 'Dış servis', c: '--k-external' },
  device: { name: 'Cihaz', c: '--k-device' }, script: { name: 'Betik', c: '--k-script' }
};
const EDGE = {
  call: { name: 'Çağırır', c: '--e-call', on: true }, read: { name: 'Okur', c: '--e-read', on: true }, write: { name: 'Yazar', c: '--e-write', on: true },
  event: { name: 'Olay yayınlar', c: '--e-event', on: true }, external: { name: 'Dışarıya', c: '--e-external', on: true }, use: { name: 'Kullanır', c: '--e-use', on: true },
  route: { name: 'Yönlendirir', c: '--e-route', on: false }, contain: { name: 'İçerir', c: '--e-route', on: false }
};
const METHOD_C = { GET: '--m-get', POST: '--m-post', PATCH: '--m-patch', DELETE: '--m-delete', SSE: '--m-sse' };
const byId = new Map(G.nodes.map(n => [n.id, n]));
const out = new Map(), inc = new Map();
G.nodes.forEach(n => { out.set(n.id, []); inc.set(n.id, []); });
G.edges.forEach(e => { out.get(e.s).push(e); inc.get(e.t).push(e); });
const nodeColor = n => css(n.kind === 'api' ? METHOD_C[n.method] || '--m-get' : KIND[n.kind].c);

$('#meta').textContent = `kaynak ${G.sha} · ${G.nodes.length} düğüm · ${G.edges.length} bağlantı · koddan çıkarıldı`;

/* ---------- yerleşim: katman başına düzlem, düzlem içinde kuvvet dengesi ---------- */
const GAP = 9, Y0 = (LAYERS.length - 1) / 2 * GAP;
function layout() {
  const P = new Map();
  const per = LAYERS.map((_, i) => G.nodes.filter(n => n.layer === i));
  per.forEach(list => list.forEach((n, i) => {
    const ring = list.length > 14 ? (i % 2 ? 1 : .62) : 1;
    const a = i / list.length * Math.PI * 2 + n.layer * .7;
    const r = (2.4 + Math.sqrt(list.length) * 1.25) * ring;
    P.set(n.id, { x: Math.cos(a) * r, z: Math.sin(a) * r, vx: 0, vz: 0 });
  }));
  const springs = G.edges.filter(e => e.kind !== 'route' && e.kind !== 'contain');
  for (let it = 0; it < 420; it++) {
    const cool = 1 - it / 420;
    per.forEach(list => {
      for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
        const a = P.get(list[i].id), b = P.get(list[j].id);
        let dx = a.x - b.x, dz = a.z - b.z, d2 = dx * dx + dz * dz + .01;
        const f = 5.2 / d2;
        a.vx += dx * f; a.vz += dz * f; b.vx -= dx * f; b.vz -= dz * f;
      }
    });
    springs.forEach(e => {
      const a = P.get(e.s), b = P.get(e.t);
      const dx = b.x - a.x, dz = b.z - a.z;
      a.vx += dx * .012; a.vz += dz * .012; b.vx -= dx * .012; b.vz -= dz * .012;
    });
    P.forEach(p => {
      p.vx -= p.x * .018; p.vz -= p.z * .018;
      const sp = Math.hypot(p.vx, p.vz), lim = .5 * cool + .02;
      if (sp > lim) { p.vx *= lim / sp; p.vz *= lim / sp; }
      p.x += p.vx; p.z += p.vz; p.vx *= .55; p.vz *= .55;
    });
  }
  G.nodes.forEach(n => { const p = P.get(n.id); n.pos = new THREE.Vector3(p.x, Y0 - n.layer * GAP, p.z); });
  return per.map(list => Math.max(4, ...list.map(n => Math.hypot(n.pos.x, n.pos.z))) + 1.6);
}

/* ---------- sahne ---------- */
const stage = $('#stage'), host = $('#gl');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false }); } catch (e) { renderer = null; }
if (!window.THREE || !renderer || !THREE.OrbitControls || !THREE.CSS2DRenderer) {
  host.innerHTML = '<div class="fallback">Bu tarayıcı 3B grafik (WebGL) açamadı. Panelden düğümlere ve akışlara yine de göz atabilirsin.</div>';
}
const radii = window.THREE ? layout() : [];
const scene = renderer ? new THREE.Scene() : null;
let camera, controls, labelR, meshes = [], edgeObjs = [], layerObjs = [];
const lbls = new Map();
const state = { sel: null, layers: LAYERS.map(() => true), edges: Object.fromEntries(Object.entries(EDGE).map(([k, v]) => [k, v.on])), flow: null, step: -1, playing: false, rotate: !REDUCED, panelMin: false };

function geomFor(n) {
  const s = 1 + Math.min(n.deg, 30) / 60;
  switch (n.kind) {
    case 'ui': return new THREE.BoxGeometry(1.15 * s, .62 * s, .62 * s);
    case 'api': return new THREE.SphereGeometry(.3 * s, 20, 14);
    case 'module': return new THREE.OctahedronGeometry(.62 * s);
    case 'table': return new THREE.CylinderGeometry(.42 * s, .42 * s, .48 * s, 24);
    case 'store': return new THREE.CylinderGeometry(.7, .7, .85, 28);
    case 'script': return new THREE.ConeGeometry(.48, .9, 6);
    default: return new THREE.IcosahedronGeometry(.56 * s, 0);
  }
}
function curveFor(a, b, kind) {
  const m = a.clone().add(b).multiplyScalar(.5);
  if (Math.abs(a.y - b.y) < .1) m.y += 1.6;
  else { const out = new THREE.Vector3(m.x, 0, m.z); const l = out.length() || 1; m.addScaledVector(out.normalize(), Math.min(2.2, 1 + l * .08)); }
  return new THREE.QuadraticBezierCurve3(a, m, b);
}
function build() {
  const W = stage.clientWidth, H = stage.clientHeight;
  camera = new THREE.PerspectiveCamera(46, W / H, .1, 400);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(W, H);
  host.appendChild(renderer.domElement);
  labelR = new THREE.CSS2DRenderer();
  labelR.setSize(W, H);
  labelR.domElement.className = 'labels';
  host.appendChild(labelR.domElement);
  controls = new THREE.OrbitControls(camera, labelR.domElement);
  controls.enableDamping = true; controls.dampingFactor = .08; controls.minDistance = 6; controls.maxDistance = 120;
  controls.autoRotate = state.rotate; controls.autoRotateSpeed = .45;
  controls.addEventListener('start', () => { if (state.rotate) setRotate(false); });
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, .9));
  const dl = new THREE.DirectionalLight(0xffffff, .55); dl.position.set(10, 30, 16); scene.add(dl);

  LAYERS.forEach((L, i) => {
    const y = Y0 - i * GAP, r = radii[i];
    const disc = new THREE.Mesh(new THREE.CircleGeometry(r, 64), new THREE.MeshBasicMaterial({ transparent: true, opacity: .06, side: THREE.DoubleSide, depthWrite: false }));
    disc.rotation.x = -Math.PI / 2; disc.position.y = y - .55; scene.add(disc);
    const ringPts = new THREE.EllipseCurve(0, 0, r, r).getPoints(96).map(p => new THREE.Vector3(p.x, y - .55, p.y));
    const ring = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(ringPts), new THREE.LineBasicMaterial({ transparent: true, opacity: .35 }));
    scene.add(ring);
    const el = document.createElement('div'); el.className = 'lay-lbl'; el.textContent = `${i + 1} · ${L.name}`;
    const o = new THREE.CSS2DObject(el); o.position.set(-r * .2, y - .4, r * .98); scene.add(o);
    layerObjs.push({ disc, ring, label: o, i });
  });

  G.nodes.forEach(n => {
    const mat = new THREE.MeshStandardMaterial({ roughness: .55, metalness: .08, transparent: true, opacity: 1 });
    const m = new THREE.Mesh(geomFor(n), mat);
    m.position.copy(n.pos); m.userData.id = n.id;
    scene.add(m); meshes.push(m); n.mesh = m;
    const el = document.createElement('div');
    el.className = 'lbl' + (n.kind === 'api' ? ' api' : '');
    el.textContent = n.kind === 'api' ? n.label.replace(/^(GET|POST|PATCH|DELETE) /, (s, mm) => mm[0] + ' ') : n.label;
    el.title = n.label;
    el.addEventListener('click', ev => { ev.stopPropagation(); select(n.id); });
    const o = new THREE.CSS2DObject(el); o.position.copy(n.pos); scene.add(o);
    lbls.set(n.id, { el, o });
  });

  G.edges.forEach(e => {
    const a = byId.get(e.s).pos, b = byId.get(e.t).pos;
    const curve = curveFor(a, b, e.kind);
    const g = new THREE.BufferGeometry().setFromPoints(curve.getPoints(28));
    const line = new THREE.Line(g, new THREE.LineBasicMaterial({ transparent: true, opacity: .32, depthWrite: false }));
    scene.add(line); edgeObjs.push({ e, line, curve });
  });
  // akış izi ve parçacık
  flowLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ transparent: true, opacity: .95, linewidth: 2 }));
  flowLine.visible = false; scene.add(flowLine);
  pulse = new THREE.Mesh(new THREE.SphereGeometry(.26, 18, 12), new THREE.MeshBasicMaterial());
  halo = new THREE.Mesh(new THREE.SphereGeometry(.55, 18, 12), new THREE.MeshBasicMaterial({ transparent: true, opacity: .25, depthWrite: false }));
  pulse.visible = halo.visible = false; scene.add(pulse); scene.add(halo);
  applyTheme(); resetView(true);
}
let flowLine, pulse, halo;

function applyTheme() {
  if (!scene) return;
  scene.background = new THREE.Color(css('--stage'));
  const ink = new THREE.Color(css('--muted'));
  layerObjs.forEach(l => { l.disc.material.color = ink.clone(); l.ring.material.color = ink.clone(); });
  G.nodes.forEach(n => n.mesh.material.color = new THREE.Color(nodeColor(n)));
  edgeObjs.forEach(o => o.line.material.color = new THREE.Color(css(EDGE[o.e.kind].c)));
  if (flowLine) { flowLine.material.color = new THREE.Color(css('--accent')); pulse.material.color = new THREE.Color(css('--accent')); halo.material.color = new THREE.Color(css('--accent')); }
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); renderPanel(); renderToolbar(); });
new MutationObserver(() => { applyTheme(); renderPanel(); renderToolbar(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- görünürlük ve vurgu ---------- */
function visibleNode(n) { return state.layers[n.layer]; }
function visibleEdge(e) { return state.edges[e.kind] && visibleNode(byId.get(e.s)) && visibleNode(byId.get(e.t)); }
function focusSet() {
  if (state.flow) return new Set(state.flow.steps.map(s => s.id));
  if (!state.sel) return null;
  const s = new Set([state.sel]);
  out.get(state.sel).forEach(e => visibleEdge(e) && s.add(e.t));
  inc.get(state.sel).forEach(e => visibleEdge(e) && s.add(e.s));
  return s;
}
function refresh() {
  if (!scene) return;
  const F = focusSet();
  const stepId = state.flow && state.step >= 0 ? state.flow.steps[state.step].id : null;
  G.nodes.forEach(n => {
    const vis = visibleNode(n);
    n.mesh.visible = vis;
    const on = !F || F.has(n.id);
    n.mesh.material.opacity = on ? 1 : .13;
    n.mesh.scale.setScalar(n.id === state.sel || n.id === stepId ? 1.35 : 1);
    const L = lbls.get(n.id);
    L.o.visible = vis;
    L.el.classList.toggle('dim', !on);
    L.el.classList.toggle('hot', n.id === state.sel);
    L.el.classList.toggle('step', n.id === stepId);
  });
  edgeObjs.forEach(o => {
    const vis = visibleEdge(o.e);
    o.line.visible = vis;
    if (!vis) return;
    let op = .3;
    if (state.flow) op = .05;
    else if (state.sel) op = (o.e.s === state.sel || o.e.t === state.sel) ? .95 : .04;
    o.line.material.opacity = op;
  });
  layerObjs.forEach(l => { const v = state.layers[l.i]; l.disc.visible = l.ring.visible = l.label.visible = v; });
}
function setRotate(v) { state.rotate = v; if (controls) controls.autoRotate = v; $('#b-rot').setAttribute('aria-pressed', v); }

/* ---------- kamera ---------- */
let tween = null;
function flyTo(target, dist) {
  if (!camera) return;
  const from = { t: controls.target.clone(), p: camera.position.clone() };
  const dir = camera.position.clone().sub(controls.target).normalize();
  const to = { t: target.clone(), p: target.clone().addScaledVector(dir, dist ?? camera.position.distanceTo(controls.target)) };
  tween = { from, to, t0: performance.now(), dur: REDUCED ? 1 : 700 };
}
function resetView(instant) {
  if (!camera) return;
  const r = Math.max(...radii);
  const narrow = stage.clientWidth < 600;
  const d = (narrow ? 3.2 : 2.05) * Math.max(r, Y0 + 2);
  const p = new THREE.Vector3(d * .55, d * .3, d * .78);
  if (instant) { camera.position.copy(p); controls.target.set(0, narrow ? -2 : 0, 0); controls.update(); }
  else { tween = { from: { t: controls.target.clone(), p: camera.position.clone() }, to: { t: new THREE.Vector3(0, narrow ? -2 : 0, 0), p }, t0: performance.now(), dur: 800 }; }
}

/* ---------- etkileşim ---------- */
const ray = window.THREE ? new THREE.Raycaster() : null;
const ptr = { x: 0, y: 0, down: null };
function pick(ev) {
  if (!scene) return null;
  const r = renderer.domElement.getBoundingClientRect();
  const v = new THREE.Vector2((ev.clientX - r.left) / r.width * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(v, camera);
  const hit = ray.intersectObjects(meshes.filter(m => m.visible), false)[0];
  return hit ? hit.object.userData.id : null;
}
function bindPointer() {
  const el = labelR.domElement;
  el.addEventListener('pointerdown', ev => { ptr.down = { x: ev.clientX, y: ev.clientY }; });
  el.addEventListener('pointerup', ev => {
    if (!ptr.down) return;
    const moved = Math.hypot(ev.clientX - ptr.down.x, ev.clientY - ptr.down.y);
    ptr.down = null;
    if (moved > 6) return;
    const id = pick(ev);
    if (id) select(id); else if (state.sel && !state.flow) select(null);
  });
  let last = 0;
  el.addEventListener('pointermove', ev => {
    if (ev.pointerType !== 'mouse' || ptr.down) return;
    const t = performance.now(); if (t - last < 60) return; last = t;
    el.style.cursor = pick(ev) ? 'pointer' : 'grab';
  });
}
function select(id) {
  if (state.flow && id) { stopFlow(false); }
  state.sel = id;
  if (id) { setRotate(false); const n = byId.get(id); if (!state.layers[n.layer]) { state.layers[n.layer] = true; renderToolbar(); } flyTo(n.pos, Math.min(camera ? camera.position.distanceTo(controls.target) : 30, stage.clientWidth < 600 ? 32 : 26)); state.panelMin = false; }
  refresh(); renderPanel();
}

/* ---------- akışlar ---------- */
let flowAnim = null;
function startFlow(fid) {
  const f = G.flows.find(x => x.id === fid); if (!f) return;
  state.sel = null; state.flow = f; state.step = 0; state.playing = !REDUCED; state.panelMin = false;
  setRotate(false);
  if (scene) {
    const pts = [];
    for (let i = 0; i < f.steps.length - 1; i++) {
      const a = byId.get(f.steps[i].id), b = byId.get(f.steps[i + 1].id);
      const ex = G.edges.find(e => (e.s === a.id && e.t === b.id) || (e.t === a.id && e.s === b.id));
      const c = ex ? edgeObjs.find(o => o.e === ex).curve : curveFor(a.pos, b.pos, 'flow');
      let p = c.getPoints(24); if (ex && ex.s !== a.id) p = p.reverse();
      pts.push(...p);
    }
    flowLine.geometry.dispose();
    flowLine.geometry = new THREE.BufferGeometry().setFromPoints(pts);
    flowLine.visible = pulse.visible = halo.visible = true;
    const box = new THREE.Box3(); f.steps.forEach(s => box.expandByPoint(byId.get(s.id).pos));
    const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length();
    flyTo(c, Math.max(16, size * (stage.clientWidth < 600 ? 1.5 : 1.05)));
  }
  goStep(0);
}
function stopFlow(render = true) {
  state.flow = null; state.step = -1; state.playing = false; flowAnim = null;
  if (scene) { flowLine.visible = pulse.visible = halo.visible = false; }
  if (render) { refresh(); renderPanel(); }
}
function goStep(i) {
  const f = state.flow; if (!f) return;
  const prev = state.step;
  state.step = Math.max(0, Math.min(f.steps.length - 1, i));
  if (scene) {
    const a = byId.get(f.steps[Math.max(0, prev)].id).pos, b = byId.get(f.steps[state.step].id).pos;
    const ex = prev >= 0 && prev !== state.step ? G.edges.find(e => (e.s === f.steps[prev].id && e.t === f.steps[state.step].id) || (e.t === f.steps[prev].id && e.s === f.steps[state.step].id)) : null;
    let curve = ex ? edgeObjs.find(o => o.e === ex).curve : curveFor(a, b, 'flow');
    const rev = ex && ex.s !== f.steps[prev].id;
    flowAnim = { curve, rev, t0: performance.now(), dur: prev === state.step || REDUCED ? 1 : 900 };
  }
  refresh(); renderPanel();
}
let playTimer = null;
function schedule() {
  clearTimeout(playTimer);
  if (!state.flow || !state.playing) return;
  playTimer = setTimeout(() => {
    if (!state.flow || !state.playing) return;
    if (state.step >= state.flow.steps.length - 1) { state.playing = false; renderPanel(); return; }
    goStep(state.step + 1); schedule();
  }, 2300);
}

/* ---------- panel ---------- */
const kindDot = n => `<span class="kdot" style="background:${nodeColor(n)}"></span>`;
function nodeBtn(id, tag) { const n = byId.get(id); return `<li><button data-go="${esc(id)}">${kindDot(n)}<span class="nm">${esc(n.label)}</span><span class="tag">${esc(tag || LAYERS[n.layer].short)}</span></button></li>`; }
function groupEdges(list, side) {
  const g = {};
  list.forEach(e => { (g[e.kind] ||= []).push(e); });
  return Object.entries(g).map(([k, es]) => `<div><h3>${EDGE[k].name} · ${es.length}</h3><ul class="list">${es.map(e => nodeBtn(side === 'out' ? e.t : e.s, e.label)).join('')}</ul></div>`).join('');
}
function renderPanel() {
  const P = $('#panel');
  P.classList.toggle('min', state.panelMin);
  const handle = `<button class="sheet-handle" data-act="sheet" aria-label="${state.panelMin ? 'Paneli aç' : 'Paneli küçült'}"><span></span></button>`;
  if (state.flow) {
    const f = state.flow;
    P.innerHTML = handle + `<div><div class="eyebrow">Akış · ${state.step + 1}/${f.steps.length}</div><h2>${esc(f.name)}</h2></div>
      <div class="row"><button class="btn primary" data-act="play">${state.playing ? 'Duraklat' : state.step >= f.steps.length - 1 ? 'Baştan oynat' : 'Oynat'}</button>
        <button class="btn" data-act="prev" aria-label="Önceki adım">‹</button><button class="btn" data-act="next" aria-label="Sonraki adım">›</button><button class="btn" data-act="close">Kapat</button></div>
      <ol class="steps">${f.steps.map((s, i) => { const n = byId.get(s.id); return `<li class="${i === state.step ? 'on' : i < state.step ? 'done' : ''}" data-step="${i}"><span><b>${esc(n.label)}</b><span>${esc(s.text)}</span></span></li>`; }).join('')}</ol>`;
    P.querySelector('.steps li.on')?.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' });
    return;
  }
  if (state.sel) {
    const n = byId.get(state.sel);
    const o = out.get(n.id).filter(visibleEdge), i = inc.get(n.id).filter(visibleEdge);
    const where = n.file ? `${n.file}${n.line ? ':' + n.line : ''}` : '';
    P.innerHTML = handle + `<div><div class="eyebrow">${kindDot(n)}${esc(KIND[n.kind].name)} · ${esc(LAYERS[n.layer].name)}</div><h2>${esc(n.label)}</h2>
      ${where ? `<div class="mono">${esc(where)}${n.loc ? ` · ${n.loc} satır` : ''}</div>` : ''}</div>
      ${n.desc ? `<p>${esc(n.desc)}</p>` : ''}
      ${n.kind === 'api' && n.auth === false ? '<div class="note">Giriş gerektirmez.</div>' : ''}
      <div class="row mono">${o.length} giden · ${i.length} gelen bağlantı</div>
      ${o.length ? `<section><h3 style="color:var(--ink)">Giden</h3>${groupEdges(o, 'out')}</section>` : ''}
      ${i.length ? `<section><h3 style="color:var(--ink)">Gelen</h3>${groupEdges(i, 'in')}</section>` : ''}
      <div class="row"><button class="btn" data-act="clear">Seçimi kaldır</button></div>`;
    return;
  }
  const counts = LAYERS.map((_, i) => G.nodes.filter(n => n.layer === i).length);
  const hubs = [...G.nodes].sort((a, b) => b.deg - a.deg).slice(0, 6);
  P.innerHTML = handle + `<div><div class="eyebrow">Genel bakış</div><h2>Projede ne neye bağlı</h2></div>
    <p>Her kat bir katman: en üstte telefon ve dış servisler, en altta kurulum betikleri. Bir düğüme dokun: neyi çağırdığını, hangi tabloya yazdığını görürsün. Bir akışı oynat: bir işlemin katmanlar arasında nasıl ilerlediğini adım adım izlersin.</p>
    <section><h3>Akışlar</h3><div class="flows">${G.flows.map(f => `<button class="flow-btn" data-flow="${f.id}">${esc(f.name)}<span>${f.steps.length} adım</span></button>`).join('')}</div></section>
    <section><h3>Katmanlar</h3><div class="layers">${LAYERS.map((L, i) => `<div class="layer-row"><span class="num">${i + 1}</span><b>${esc(L.name)}</b><span class="n">${counts[i]}</span></div>`).join('')}</div></section>
    <section><h3>En çok bağlantısı olanlar</h3><ul class="list">${hubs.map(n => nodeBtn(n.id, n.deg + ' bağ')).join('')}</ul></section>
    <section><h3>Şekiller</h3><div class="legend">${Object.entries(KIND).map(([k, v]) => `<div><span class="kdot" style="background:${css(v.c)}"></span>${v.name}</div>`).join('')}
      <div><span class="kdot" style="background:${css('--m-get')}"></span>GET <span class="kdot" style="background:${css('--m-post')}"></span>POST <span class="kdot" style="background:${css('--m-patch')}"></span>PATCH <span class="kdot" style="background:${css('--m-delete')}"></span>DELETE</div></div></section>
    <p class="mono">Kaynak özeti ${esc(G.sha)} (api.py, app.js, db.py ve betiklerin içeriğinden). Yeniden üretmek için: python3 tools/proje-haritasi/uret.py. Uç noktalar ve tablo erişimleri api.py'den, arayüz çağrıları app.js'den otomatik çıkarıldı; akış açıklamaları elle yazıldı.</p>`;
}
function renderToolbar() {
  const T = $('#toolbar');
  T.innerHTML = LAYERS.map((L, i) => `<button class="chip" data-layer="${i}" aria-pressed="${state.layers[i]}">${esc(L.short)}</button>`).join('')
    + Object.entries(EDGE).map(([k, v]) => `<button class="chip" data-edge="${k}" aria-pressed="${state.edges[k]}"><span class="sw" style="background:${css(v.c)}"></span>${v.name}</button>`).join('');
}

document.addEventListener('click', ev => {
  const go = ev.target.closest('[data-go]'); if (go) { select(go.dataset.go); return; }
  const fl = ev.target.closest('[data-flow]'); if (fl) { startFlow(fl.dataset.flow); schedule(); return; }
  const st = ev.target.closest('[data-step]'); if (st) { state.playing = false; goStep(+st.dataset.step); return; }
  const ly = ev.target.closest('[data-layer]'); if (ly) { const i = +ly.dataset.layer; state.layers[i] = !state.layers[i]; if (state.sel && byId.get(state.sel).layer === i && !state.layers[i]) state.sel = null; renderToolbar(); refresh(); renderPanel(); return; }
  const ed = ev.target.closest('[data-edge]'); if (ed) { state.edges[ed.dataset.edge] = !state.edges[ed.dataset.edge]; renderToolbar(); refresh(); renderPanel(); return; }
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'play') { if (state.step >= state.flow.steps.length - 1 && !state.playing) goStep(0); state.playing = !state.playing; renderPanel(); schedule(); }
  if (act === 'prev') { state.playing = false; goStep(state.step - 1); }
  if (act === 'next') { state.playing = false; goStep(state.step + 1); }
  if (act === 'close') { clearTimeout(playTimer); stopFlow(); resetView(); }
  if (act === 'clear') { select(null); resetView(); }
  if (act === 'sheet') { state.panelMin = !state.panelMin; renderPanel(); }
});
$('#b-rot').addEventListener('click', () => setRotate(!state.rotate));
$('#b-reset').addEventListener('click', () => { clearTimeout(playTimer); if (state.flow) stopFlow(); state.sel = null; refresh(); renderPanel(); resetView(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (state.flow) { clearTimeout(playTimer); stopFlow(); } else if (state.sel) select(null); }
  if (state.flow && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && document.activeElement?.id !== 'q') { state.playing = false; goStep(state.step + (ev.key === 'ArrowRight' ? 1 : -1)); }
});

/* arama */
const q = $('#q'), res = $('#results');
let hits = [], hi = 0;
const norm = s => s.toLocaleLowerCase('tr');
function renderResults() {
  if (!hits.length) { res.hidden = true; return; }
  res.hidden = false;
  res.innerHTML = hits.map((n, i) => `<button data-hit="${i}" class="${i === hi ? 'on' : ''}"><span>${kindDot(n)} ${esc(n.label)}</span><span class="lay">${esc(LAYERS[n.layer].short)}</span></button>`).join('');
}
q.addEventListener('input', () => {
  const v = norm(q.value.trim());
  hits = v ? G.nodes.filter(n => norm(n.label + ' ' + (n.desc || '') + ' ' + (n.file || '')).includes(v)).sort((a, b) => norm(a.label).indexOf(v) - norm(b.label).indexOf(v)).slice(0, 8) : [];
  hi = 0; renderResults();
});
q.addEventListener('keydown', ev => {
  if (ev.key === 'ArrowDown') { hi = Math.min(hits.length - 1, hi + 1); renderResults(); ev.preventDefault(); }
  if (ev.key === 'ArrowUp') { hi = Math.max(0, hi - 1); renderResults(); ev.preventDefault(); }
  if (ev.key === 'Enter' && hits[hi]) { select(hits[hi].id); hits = []; renderResults(); q.blur(); }
  if (ev.key === 'Escape') { hits = []; renderResults(); }
});
res.addEventListener('click', ev => { const b = ev.target.closest('[data-hit]'); if (!b) return; select(hits[+b.dataset.hit].id); hits = []; renderResults(); q.value = ''; });
document.addEventListener('pointerdown', ev => { if (!ev.target.closest('.search')) { hits = []; renderResults(); } });

/* ---------- döngü ---------- */
const ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
function frame(now) {
  requestAnimationFrame(frame);
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = ease(k);
    controls.target.lerpVectors(tween.from.t, tween.to.t, e);
    camera.position.lerpVectors(tween.from.p, tween.to.p, e);
    if (k >= 1) tween = null;
  }
  controls.update();
  if (state.flow && flowAnim) {
    const k = Math.min(1, (now - flowAnim.t0) / flowAnim.dur);
    const p = flowAnim.curve.getPoint(flowAnim.rev ? 1 - ease(k) : ease(k));
    pulse.position.copy(p); halo.position.copy(p);
    halo.scale.setScalar(1 + .25 * Math.sin(now / 180));
  }
  // uzaktaki uç nokta etiketlerini sadeleştir
  if (!state.sel && !state.flow) {
    lbls.forEach((L, id) => {
      const n = byId.get(id);
      if (n.kind !== 'api') { L.el.style.opacity = ''; return; }
      const d = camera.position.distanceTo(n.pos);
      L.el.style.opacity = Math.max(.0, Math.min(1, (34 - d) / 12)).toFixed(2);
    });
  } else lbls.forEach(L => { L.el.style.opacity = ''; });
  renderer.render(scene, camera);
  labelR.render(scene, camera);
}
function resize() {
  if (!camera) return;
  const W = stage.clientWidth, H = stage.clientHeight;
  camera.aspect = W / H; camera.updateProjectionMatrix();
  renderer.setSize(W, H); labelR.setSize(W, H);
}
new ResizeObserver(resize).observe(stage);

renderToolbar(); renderPanel();
if (scene) { build(); bindPointer(); refresh(); requestAnimationFrame(frame); }
})();
</script>

</body>
</html>
