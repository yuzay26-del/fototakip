name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
        pillow: ["with-pillow", "no-pillow"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Pillow
        if: matrix.pillow == 'with-pillow'
        run: pip install pillow
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Check shell scripts
        run: bash -n scripts/*.sh
      - name: Check JavaScript syntax
        run: node --check web/app.js && node --check web/sw.js
      - name: Check project map is up to date
        if: matrix.python == '3.12' && matrix.pillow == 'with-pillow'
        run: python tools/proje-haritasi/uret.py --check
