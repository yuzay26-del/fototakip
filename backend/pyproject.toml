[project]
name = "fototakip-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
